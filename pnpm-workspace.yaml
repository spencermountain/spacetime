packages:
  - plugins/*

allowBuilds:
  esbuild: true

catalog:
  '@rollup/plugin-commonjs': ^29.0.3
  '@rollup/plugin-node-resolve': ^16.0.3
  '@rollup/plugin-terser': ^1.0.2
  minimist: ^1.2.8
  rollup: 4.67.2
  tap-dancer: 0.4.4
  tape: 5.10.3

catalogMode: manual

overrides:
  # tape's glob@7 can't run the patched minimatch below; glob 14 can, and still supports node 18
  glob@<14.0.2: ^14.0.3
  minimatch@<11.0.1: '>=11.0.1'
  serialize-javascript@<7.1.3: '>=7.1.3'
